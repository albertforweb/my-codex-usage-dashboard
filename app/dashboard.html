<script>
(() => {
let data=null,range='all',query='',modelMetric='sessions',columnFilters={},openFilter=null,columnSearch='',sortState={column:null,direction:'asc'};
const tableColumns=[['started','Started'],['model','Model'],['effort','Effort'],['tokens','Tokens'],['cwd','Project path'],['source','Source']];
const $=s=>document.querySelector(s), fmt=n=>new Intl.NumberFormat().format(Math.round(n||0)), compact=n=>Intl.NumberFormat(undefined,{notation:'compact',maximumFractionDigits:1}).format(n||0);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function since(){if(range==='all')return null;const d=new Date();d.setDate(d.getDate()-Number(range));return d}
function filtered(){const after=since();return (data?.sessions||[]).filter(s=>{const dt=new Date(s.timestamp||0);if(after&&dt<after)return false;const hay=[s.id,s.cwd,s.source,...Object.keys(s.models),...Object.values(s.models).flatMap(x=>Object.keys(x.efforts))].join(' ').toLowerCase();return !query||hay.includes(query.toLowerCase())})}
function rollup(sessions){const r={sessions:sessions.length,models:{},efforts:{},tokens:{input_tokens:0,output_tokens:0,reasoning_output_tokens:0,total_tokens:0,cached_input_tokens:0,cache_write_input_tokens:0},tokenSessions:0};for(const s of sessions){if(s.tokenSource!=='unavailable')r.tokenSessions++;for(const [k,v] of Object.entries(s.tokens||{}))if(k in r.tokens)r.tokens[k]+=v||0;for(const [m,v]of Object.entries(s.models||{})){const a=r.models[m]||(r.models[m]={sessions:0,turns:0,tokens:{total_tokens:0}});a.sessions++;a.turns+=v.turns||0;a.tokens.total_tokens+=(v.tokens?.total_tokens||0);for(const [e,n]of Object.entries(v.efforts||{}))r.efforts[e]=(r.efforts[e]||0)+n}}return r}

function columnValues(s,column){
 if(column==='started')return [s.timestamp||'__blank__'];
 if(column==='model')return Object.keys(s.models||{}).length?Object.keys(s.models):['__blank__'];
 if(column==='effort'){const v=[...new Set(Object.values(s.models||{}).flatMap(m=>Object.keys(m.efforts||{})))];return v.length?v:['__blank__']}
 if(column==='tokens')return s.tokenSource==='unavailable'?['__no_tokens__']:[String(s.tokens?.total_tokens||0)];
 if(column==='cwd')return s.cwd?[s.cwd]:['__blank__'];
 if(column==='source')return s.source?[s.source]:['__blank__'];
 return ['__blank__'];
}
function displayValue(column,value){
 if(value==='__blank__')return '(Blanks)';
 if(value==='__no_tokens__')return '— (no token data)';
 if(column==='started')return value==='__blank__'?'(Blanks)':new Date(value).toLocaleString();
 if(column==='tokens')return new Intl.NumberFormat().format(Number(value)||0);
 return value;
}
function tableFiltered(sessions){
 let rows=sessions.filter(s=>Object.entries(columnFilters).every(([column,selected])=>columnValues(s,column).some(v=>selected.includes(v))));
 if(sortState.column){
  const column=sortState.column,dir=sortState.direction==='asc'?1:-1;
  rows.sort((left,right)=>{
   const a=columnValues(left,column),b=columnValues(right,column),av=column==='tokens'?a[0]:a.join(', '),bv=column==='tokens'?b[0]:b.join(', ');
   if(column==='tokens'){const am=av==='__no_tokens__',bm=bv==='__no_tokens__';if(am!==bm)return am?1:-1;return (Number(av)-Number(bv))*dir}
   const aa=av==='__blank__'?'':av,bb=bv==='__blank__'?'':bv;
   return aa.localeCompare(bb,undefined,{numeric:true,sensitivity:'base'})*dir;
  });
 }
 return rows;
}
function renderTable(rows){
 const headers=tableColumns.map(([column,label])=>'<th'+(column==='cwd'?' class="hide-sm"':'')+'><div class="th-tools"><span>'+esc(label)+(sortState.column===column?'<span class="sort-mark"> '+(sortState.direction==='asc'?'▲':'▼')+'</span>':'')+'</span><button class="filter-trigger'+(columnFilters[column]?' active':'')+'" data-filter="'+column+'" aria-label="Filter or sort '+esc(label)+'" title="Filter or sort '+esc(label)+'">▾</button></div></th>').join('');
 const body=rows.map(s=>{
  const models=Object.entries(s.models||{}),efforts=[...new Set(models.flatMap(([,v])=>Object.keys(v.efforts||{})))];
  return '<tr><td class="mono">'+esc(s.timestamp?new Date(s.timestamp).toLocaleString():'Unknown')+'</td><td>'+(models.length?models.map(([m])=>'<span class="pill">'+esc(m)+'</span>').join(''):'<span class="sub">unknown</span>')+'</td><td>'+(efforts.length?efforts.map(e=>'<span class="pill">'+esc(e)+'</span>').join(''):'<span class="sub">unknown</span>')+'</td><td class="mono" title="'+esc(s.tokenSource)+'">'+(s.tokenSource==='unavailable'?'—':fmt(s.tokens.total_tokens))+'</td><td class="path hide-sm" title="'+esc(s.cwd)+'">'+esc(s.cwd||'—')+'</td><td>'+esc(s.source||'—')+'</td></tr>';
 }).join('')||'<tr><td colspan="6" class="empty">No sessions match these filters</td></tr>';
 return '<section class="grid lower"><article class="card table-panel"><div class="table-head"><span class="panel-title">Sessions</span><span class="panel-meta">'+fmt(rows.length)+' rows</span>'+(Object.keys(columnFilters).length?'<button class="table-clear" id="clearColumnFilters">Clear column filters</button>':'')+'<input class="search" id="search" placeholder="Filter sessions…" value="'+esc(query)+'" aria-label="Filter sessions"></div><div style="overflow:auto;max-height:460px"><table><thead><tr>'+headers+'</tr></thead><tbody>'+body+'</tbody></table></div><div class="foot"><span>Conversation content is not read or displayed.</span><span>'+fmt(rows.filter(s=>s.tokenSource!=='unavailable').length)+' sessions include token counters</span></div></article></section>';
}
function bindTableControls(){
 document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{const column=button.dataset.filter;openFilter=openFilter===column?null:column;columnSearch='';render()}));
 const clear=document.querySelector('#clearColumnFilters');if(clear)clear.addEventListener('click',()=>{columnFilters={};openFilter=null;render()});
}
function renderFilterMenu(sessions){
 document.querySelector('.column-filter-menu')?.remove();if(!openFilter)return;
 const column=openFilter,label=tableColumns.find(x=>x[0]===column)?.[1]||column,anchor=document.querySelector('[data-filter="'+column+'"]');if(!anchor)return;
 const allValues=[...new Set(sessions.flatMap(s=>columnValues(s,column)))].sort((a,b)=>displayValue(column,a).localeCompare(displayValue(column,b),undefined,{numeric:true,sensitivity:'base'}));
 const values=allValues.filter(v=>displayValue(column,v).toLowerCase().includes(columnSearch.toLowerCase())),selected=new Set(columnFilters[column]||allValues);
 const menu=document.createElement('div');menu.className='column-filter-menu';menu.setAttribute('role','dialog');menu.setAttribute('aria-label',label+' filter menu');
 const sortLabels=column==='tokens'?['Smallest → Largest','Largest → Smallest']:column==='started'?['Oldest → Newest','Newest → Oldest']:['A → Z','Z → A'];
 menu.innerHTML='<div class="filter-menu-actions"><button type="button" data-sort="asc">Sort '+sortLabels[0]+'</button><button type="button" data-sort="desc">Sort '+sortLabels[1]+'</button></div><input class="filter-search" type="search" placeholder="Search values…" aria-label="Search '+esc(label)+' values" value="'+esc(columnSearch)+'"><label class="filter-option filter-select-all"><input type="checkbox" data-select-all> <span>Select all values ('+allValues.length+')</span></label><div class="filter-options">'+(values.map(v=>'<label class="filter-option"><input type="checkbox" data-value="'+esc(v)+'" '+(selected.has(v)?'checked':'')+'><span title="'+esc(displayValue(column,v))+'">'+esc(displayValue(column,v))+'</span></label>').join('')||'<div class="empty">No matching values</div>')+'</div><div class="filter-footer"><span>Changes apply immediately</span><button type="button" class="filter-clear">Clear this filter</button></div>';
 document.body.appendChild(menu);const rect=anchor.getBoundingClientRect(),left=Math.max(8,Math.min(rect.right-menu.offsetWidth,innerWidth-menu.offsetWidth-8));menu.style.left=left+'px';menu.style.top=Math.max(8,Math.min(rect.bottom+4,innerHeight-menu.offsetHeight-8))+'px';
 const selectAll=menu.querySelector('[data-select-all]'),selectedVisible=allValues.filter(v=>selected.has(v)).length;selectAll.checked=allValues.length>0&&selectedVisible===allValues.length;selectAll.indeterminate=selectedVisible>0&&selectedVisible<allValues.length;
 menu.querySelectorAll('[data-sort]').forEach(button=>button.addEventListener('click',()=>{sortState={column,direction:button.dataset.sort};openFilter=null;render()}));
 menu.querySelector('.filter-clear').addEventListener('click',()=>{delete columnFilters[column];openFilter=null;render()});
 menu.querySelector('.filter-search').addEventListener('input',event=>{columnSearch=event.target.value;renderFilterMenu(sessions);const input=document.querySelector('.column-filter-menu .filter-search');input.focus();input.setSelectionRange(input.value.length,input.value.length)});
 selectAll.addEventListener('change',event=>{if(event.target.checked)delete columnFilters[column];else columnFilters[column]=[];render()});
 menu.querySelectorAll('[data-value]').forEach(input=>input.addEventListener('change',event=>{const chosen=new Set(columnFilters[column]||allValues),value=event.target.dataset.value;if(event.target.checked)chosen.add(value);else chosen.delete(value);if(chosen.size===allValues.length)delete columnFilters[column];else columnFilters[column]=[...chosen];render()}));
}

function render(){if(!data)return;const sessions=filtered(),tableRows=tableFiltered(sessions),tableHtml=renderTable(tableRows),t=rollup(sessions),metricValue=v=>modelMetric==='sessions'?v.sessions:(v.tokens?.total_tokens||0),models=Object.entries(t.models).sort((a,b)=>metricValue(b[1])-metricValue(a[1])),efforts=Object.entries(t.efforts).sort((a,b)=>b[1]-a[1]),maxM=Math.max(1,...models.map(x=>metricValue(x[1]))),maxE=Math.max(1,...efforts.map(x=>x[1])),maxTok=Math.max(1,t.tokens.input_tokens,t.tokens.output_tokens);const totalUsed=sessions.filter(s=>s.tokenSource!=='unavailable').length;
$('#content').className='';$('#content').innerHTML=`
<section class="grid kpis">
 <article class="card kpi"><div class="label">Sessions</div><div class="value">${fmt(t.sessions)}</div><div class="hint">${models.length} models recorded in selected range</div></article>
 <article class="card kpi"><div class="label">Turns with model metadata</div><div class="value">${fmt(Object.values(t.models).reduce((n,m)=>n+m.turns,0))}</div><div class="hint">Model and effort captured in turn context</div></article>
 <article class="card kpi"><div class="label">Recorded tokens</div><div class="value">${compact(t.tokens.total_tokens)}</div><div class="hint">Available for ${fmt(totalUsed)} of ${fmt(t.sessions)} selected sessions</div></article>
 <article class="card kpi"><div class="label">Output tokens</div><div class="value">${compact(t.tokens.output_tokens)}</div><div class="hint">${compact(t.tokens.reasoning_output_tokens)} reasoning output</div></article>
</section>
<section class="grid charts">
 <article class="card panel"><div class="panel-head"><span class="panel-title">Model usage</span><select id="modelMetric" aria-label="Model usage metric" style="background:#20242d;border:1px solid var(--line);border-radius:4px;padding:4px 6px"><option value="sessions" ${modelMetric==='sessions'?'selected':''}>Chats</option><option value="tokens" ${modelMetric==='tokens'?'selected':''}>Tokens</option></select></div><div class="model-list">${models.length?models.map(([m,v])=>`<div class="model-row"><span class="model-name" title="${esc(m)}">${esc(m)}</span><div class="track"><div class="fill" style="width:${Math.max(1,metricValue(v)/maxM*100)}%"></div></div><span class="model-count">${modelMetric==='sessions'?fmt(v.sessions):compact(metricValue(v))}</span></div>`).join(''):'<div class="empty">No model metadata in this range</div>'}</div></article>
 <article class="card panel"><div class="panel-head"><span class="panel-title">Reasoning effort</span><span class="panel-meta">captured turns</span></div><div class="effort-list">${efforts.length?efforts.map(([e,n])=>`<div class="effort-line"><span>${esc(e)}</span><div class="track"><div class="fill" style="width:${Math.max(1,n/maxE*100)}%"></div></div><span class="model-count">${fmt(n)}</span></div>`).join(''):'<div class="empty">No effort metadata in this range</div>'}</div></article>
 <article class="card panel"><div class="panel-head"><span class="panel-title">Token volume</span><span class="panel-meta">recorded usage</span></div><div class="tokens"><div class="token-block"><span class="token-name">Input</span><div class="token-right"><div class="token-value">${fmt(t.tokens.input_tokens)}</div><div class="token-track"><div class="fill input-fill" style="width:${Math.max(1,t.tokens.input_tokens/maxTok*100)}%"></div></div></div></div><div class="token-block"><span class="token-name">Output</span><div class="token-right"><div class="token-value">${fmt(t.tokens.output_tokens)}</div><div class="token-track"><div class="fill output-fill" style="width:${Math.max(1,t.tokens.output_tokens/maxTok*100)}%"></div></div></div></div><div class="hint">Cached input: ${fmt(t.tokens.cached_input_tokens||0)} · cache writes: ${fmt(t.tokens.cache_write_input_tokens||0)}</div><div class="hint warn">Totals reflect counters present in local logs.</div></div></article>
</section>
${tableHtml}`;
bindTableControls();renderFilterMenu(sessions);
$('#updated').textContent='Scanned '+new Date(data.totals.scannedAt).toLocaleTimeString();$('#search').addEventListener('input',e=>{query=e.target.value;const pos=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)});$('#modelMetric').addEventListener('change',e=>{modelMetric=e.target.value;render()});
}
async function refresh(){if(!window.myUsageRefresh){try{const snapshot=JSON.parse($('#usage-snapshot').textContent);if(snapshot?.sessions){data=snapshot;render();return}}catch{}$('#content').className='loading err';$('#content').textContent='No local usage snapshot is available yet. Open My Usage in Codex or run the daily scan.';return}$('#content').className='loading';$('#content').textContent='Scanning local Codex session logs…';await window.myUsageRefresh() }
window.addEventListener('my-usage-data',e=>{data=e.detail;render()});
window.addEventListener('my-usage-error',e=>{$('#content').className='loading err';$('#content').textContent='Could not load local usage data: '+e.detail});
document.addEventListener('pointerdown',e=>{if(openFilter&&!e.target.closest('.column-filter-menu')&&!e.target.closest('[data-filter]')){openFilter=null;document.querySelector('.column-filter-menu')?.remove()}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&openFilter){openFilter=null;document.querySelector('.column-filter-menu')?.remove()}});
document.querySelectorAll('[data-range]').forEach(b=>b.addEventListener('click',()=>{range=b.dataset.range;document.querySelectorAll('[data-range]').forEach(x=>x.classList.toggle('active',x===b));render()}));$('#refresh').addEventListener('click',refresh);refresh();
})();
</script></body></html>
